[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-studio"
version = "0.1.0"
description = "AI-first local desktop coding IDE"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vibe Studio" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
# Core development tools
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
]

# Semantic / vector search (Graph RAG, AST chunking)
rag = [
    "sentence-transformers>=2.2.0",
]

# Call graph & inheritance graph analysis
graph = [
    "networkx>=3.3",
]

# LSP server installations (language-specific)
# Install manually: npm i -g pyright typescript-language-server
# or: pip install python-lsp-server
# Binaries: gopls (go install golang.org/x/tools/gopls@latest)
#           rust-analyzer (rustup component add rust-analyzer)
#           clangd (apt/brew install clangd)
lsp = [
    "python-lsp-server>=1.10.0",
]

# Multi-agent swarm coordination
swarm = [
    "networkx>=3.3",
    "httpx>=0.27.0",
]

# Web/REST API server mode
web = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

# Security & sandboxing extras
security = [
    "cryptography>=42.0.0",
]

# Install everything
all = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "sentence-transformers>=2.2.0",
    "networkx>=3.3",
    "python-lsp-server>=1.10.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "cryptography>=42.0.0",
]

[project.scripts]
vibe-studio = "vibe_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibe_studio*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

